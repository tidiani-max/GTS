# Start:  docker compose up --build        then seed demo data once:  docker compose exec api python -m app.seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gst}
      POSTGRES_DB: gst
    volumes:
      - gst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gst -d gst"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: [.env]
    environment: &appenv
      DATABASE_URL: postgresql+psycopg://gst:${POSTGRES_PASSWORD:-gst}@db:5432/gst
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment: *appenv
    depends_on:
      api: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: /api/v1 }
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:80"]
    restart: unless-stopped

volumes:
  gst_pgdata:
